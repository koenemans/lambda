{{ $image := .Page.Resources.Get .Destination }}
{{ with $image }}
  {{ $1x := .Resize "1000x webp q100" }}
  {{ $2x := .Resize "2000x webp q100" }}
  <img src="{{ $1x.RelPermalink }}"
       srcset="{{ $1x.RelPermalink }} 1x, {{ $2x.RelPermalink }} 2x"
       alt="{{ $.Text }}"
       title="{{ $.Title }}"
       width="{{ $1x.Width }}"
       height="{{ $1x.Height }}"
       loading="lazy" />
{{ else }}
  <img src="{{ .Destination }}" alt="{{ .Text }}" title="{{ .Title }}" />
{{ end }}
