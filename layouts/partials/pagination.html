<nav aria-label="Pagination">
{{ if .Paginator.HasPrev }}
	<a href="{{ .Paginator.Prev.URL }}" rel="prev">Previous Page</a>
{{ end }}
<span aria-current="page">Page {{ .Paginator.PageNumber }} of {{ .Paginator.TotalPages }}</span>
{{ if .Paginator.HasNext }}
	<a href="{{ .Paginator.Next.URL }}" rel="next">Next Page</a>
{{ end }}
</nav>
